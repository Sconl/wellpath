# ─────────────────────────────────────────────────────────────────────────────
# pubspec.yaml  — paste these into your existing file
#
# HOW TO APPLY:
#   1.  Open wellpath/pubspec.yaml
#   2.  Find the `dependencies:` section
#   3.  Add the packages below that are not already present
#   4.  Run:  flutter pub get
# ─────────────────────────────────────────────────────────────────────────────

name: wellpath
description: WellPath — Integrated Fitness & Wellness Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^2.27.1          # must be first; initialises the Firebase app
  firebase_auth: ^4.17.9          # FIX: was missing → caused uri_does_not_exist
  cloud_firestore: ^4.15.9        # Firestore — user docs, bookings, wellness logs
  firebase_messaging: ^14.7.19    # FCM push notifications (Week 6)
  firebase_analytics: ^10.8.9     # Analytics events (Week 8)
  firebase_crashlytics: ^3.4.19   # Crash reporting (Week 8)
  firebase_performance: ^0.9.3+19 # Performance monitoring (Week 8)

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1        # FIX: was missing → caused uri_does_not_exist

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^13.2.1              # FIX: was missing → caused uri_does_not_exist

  # ── UI / Typography ───────────────────────────────────────────────────────
  google_fonts: ^6.2.1            # Poppins — already used in landing_page.dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    # Animated GIFs used by signup_screen.dart and login_screen.dart
    - assets/animated-gifs/

    # Add other asset directories below as the project grows:
    # - assets/images/
    # - assets/icons/