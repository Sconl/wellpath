# ─────────────────────────────────────────────────────────────────────────────
# pubspec.yaml  — paste these into your existing file
#
# HOW TO APPLY:
#   1.  Open wellpath/pubspec.yaml
#   2.  Find the `dependencies:` section
#   3.  Add the packages below that are not already present
#   4.  Run:  flutter pub get
# ─────────────────────────────────────────────────────────────────────────────

name: wellpath
description: WellPath — Integrated Fitness & Wellness Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─────────────────────────────────────────────────────────────────────────────
  # Backend & Cloud Services
  # ─────────────────────────────────────────────────────────────────────────────
  firebase_core: ^4.6.0           # Core Firebase initialization (must be first)
  firebase_auth: ^6.3.0           # User authentication and session management
  cloud_firestore: ^6.2.0         # Realtime database for users, bookings, wellness logs
  firebase_messaging: ^16.1.3     # Cloud Messaging for push notifications
  firebase_analytics: ^12.2.0     # Usage analytics tracking
  firebase_crashlytics: ^5.1.0    # Crash reporting and error tracking
  firebase_performance: ^0.11.2   # Performance monitoring

  # ─────────────────────────────────────────────────────────────────────────────
  # State Management
  # ─────────────────────────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1        # Reactive state management (kept at 2.x for compatibility)

  # ─────────────────────────────────────────────────────────────────────────────
  # Routing & Navigation
  # ─────────────────────────────────────────────────────────────────────────────
  go_router: ^14.0.0              # Declarative routing and deep linking

  # ─────────────────────────────────────────────────────────────────────────────
  # UI & Design System
  # ─────────────────────────────────────────────────────────────────────────────
  google_fonts: ^8.0.2            # Google Fonts typography support (Poppins, etc.)
  flutter_svg: ^2.0.7             # SVG asset rendering

  # ─────────────────────────────────────────────────────────────────────────────
  # Location, Maps & Geolocation
  # ─────────────────────────────────────────────────────────────────────────────
  geolocator: ^12.0.0             # Device location services
  google_maps_flutter: ^2.17.0    # Google Maps integration (mobile/web)
  mapbox_maps_flutter: ^2.0.0     # Mapbox Maps for detailed map rendering
  flutter_map: ^8.2.2             # OpenStreetMap tiles for web fallback
  latlong2: ^0.9.0                # Latitude/longitude coordinate handling

  # ─────────────────────────────────────────────────────────────────────────────
  # Networking & Utilities
  # ─────────────────────────────────────────────────────────────────────────────
  http: ^1.2.0                    # HTTP client for API requests
  url_launcher: ^6.3.0            # Open URLs and handle deep links

  # ─────────────────────────────────────────────────────────────────────────────
  # AI & Machine Learning
  # ─────────────────────────────────────────────────────────────────────────────
  google_generative_ai: ^0.4.6    # Google AI/Gemini API integration
  shared_preferences: ^2.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─────────────────────────────────────────────────────────────────────────────
  # Development & Testing
  # ─────────────────────────────────────────────────────────────────────────────
  flutter_lints: ^6.0.0           # Lint rules for Dart code quality

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/gifs/
    - assets/logos/